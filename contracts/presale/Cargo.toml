[workspace]
members = [
    "programs/*"
]
resolver = "2"

# Tells solana-verify which build image to use (agave CLI version).
# 3.1.x ships platform-tools v1.52 (Rust 1.89), matching the deploy toolchain.
[workspace.metadata.cli]
solana = "3.1.14"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
